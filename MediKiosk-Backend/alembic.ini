[alembic]
# Path is relative to this file (MediKiosk-Backend/).
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Overridden in env.py from Settings.DATABASE_URL (sync driver). Do not put passwords here.
sqlalchemy.url = driver://user:pass@localhost/medikiosk

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
