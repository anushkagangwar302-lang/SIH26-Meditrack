# MediKiosk-Backend Log Rotation Configuration
# Place this file in /etc/logrotate.d/medikiosk on production servers

# Application logs
/var/log/medikiosk/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0640 medikiosk medikiosk
    sharedscripts
    postrotate
        # Send signal to application to reopen log files
        docker-compose exec api kill -USR1 $(docker-compose exec api cat /tmp/app.pid 2>/dev/null || echo 1) 2>/dev/null || true
    endscript
}

# Nginx access logs
/var/log/nginx/access.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0640 nginx nginx
    sharedscripts
    postrotate
        # Reload nginx to reopen log files
        docker-compose exec nginx nginx -s reload 2>/dev/null || true
    endscript
}

# Nginx error logs
/var/log/nginx/error.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0640 nginx nginx
    sharedscripts
    postrotate
        # Reload nginx to reopen log files
        docker-compose exec nginx nginx -s reload 2>/dev/null || true
    endscript
}

# Docker container logs (via journalctl)
# This requires separate setup with journald rotation settings

# Audit logs (compliance - longer retention)
/var/log/medikiosk/audit.log {
    daily
    rotate 365  # Keep for 1 year for compliance
    compress
    delaycompress
    missingok
    notifempty
    create 0640 medikiosk medikiosk
    sharedscripts
    postrotate
        # Send signal to application to reopen log files
        docker-compose exec api kill -USR1 $(docker-compose exec api cat /tmp/app.pid 2>/dev/null || echo 1) 2>/dev/null || true
    endscript
}

# Celery worker logs
/var/log/medikiosk/celery*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 medikiosk medikiosk
    sharedscripts
    postrotate
        # Restart celery workers to reopen log files
        docker-compose restart celery_worker 2>/dev/null || true
    endscript
}
