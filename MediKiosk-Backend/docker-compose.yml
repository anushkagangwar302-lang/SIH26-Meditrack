# Phase 1 stub: Postgres + Redis + API.
# Phase 9 adds: extra API replicas, reverse proxy, Celery worker + beat, health on all of them.

name: medikiosk

services:
  postgres:
    image: postgres:16.8-alpine
    restart: unless-stopped
    environment:
      # SECRET — override via compose secrets / .env in production
      POSTGRES_USER: medikiosk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: medikiosk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medikiosk -d medikiosk"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://medikiosk:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/medikiosk
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./uploads/temp_scans:/app/uploads/temp_scans
      - ./uploads/encrypted_vault:/app/uploads/encrypted_vault
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
