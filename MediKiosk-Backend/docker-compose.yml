# Phase 9 — Production-ready docker-compose.yml
# Includes reverse proxy, multiple API replicas, Celery workers, Celery beat, health checks
# and proper resource limits for production deployment

name: medikiosk

services:
  # Database layer
  postgres:
    image: postgres:16.8-alpine
    restart: unless-stopped
    environment:
      # SECRET — override via compose secrets / .env in production
      POSTGRES_USER: medikiosk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: medikiosk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medikiosk -d medikiosk"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Redis layer (session state, Celery broker, distributed locks, rate limiting)
  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Reverse proxy (nginx) for load balancing and SSL termination
  nginx:
    image: nginx:1.27.3-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # FastAPI application replicas
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://medikiosk:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/medikiosk
      REDIS_HOST: redis
      # SCALE_COUNT is used for metrics and debugging
      SCALE_COUNT: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000"  # Internal port only, exposed via nginx
    volumes:
      - ./uploads/temp_scans:/app/uploads/temp_scans
      - ./uploads/encrypted_vault:/app/uploads/encrypted_vault
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    deploy:
      replicas: 3  # Environment-specific — adjust based on load
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Celery worker for background tasks (OCR, ABDM/HIS push, PDF generation)
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://medikiosk:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/medikiosk
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads/temp_scans:/app/uploads/temp_scans
      - ./uploads/encrypted_vault:/app/uploads/encrypted_vault
    healthcheck:
      test: ["CMD", "celery", "-A", "workers.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 2  # Scale based on OCR/ABDM task volume
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Celery beat for periodic tasks (temp_scans purge, health checks)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "workers.celery_app", "beat", "--loglevel=info"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://medikiosk:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/medikiosk
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery beat' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  nginx_cache:

networks:
  default:
    name: medikiosk_network
    driver: bridge
