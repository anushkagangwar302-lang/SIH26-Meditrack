# Full-stack local/self-hosted deployment: frontend SSR server + the backend stack
# (API replicas, Celery worker/beat, Postgres, Redis, nginx) defined in
# MediKiosk-Backend/docker-compose.yml.
#
#   cp MediKiosk-Backend/.env.example MediKiosk-Backend/.env   # then fill CHANGE_ME values
#   docker compose up -d --build
#
# Frontend: http://localhost:3000   API (via nginx): http://localhost/api/v1

name: meditrack

include:
  - path: MediKiosk-Backend/docker-compose.yml

services:
  frontend:
    build:
      context: ./frontend/dev-server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
